name: CI

on:
  push:
  pull_request:

# Phase 0 scope: validation only (lint, type-check, tests).
# Package publishing is intentionally deferred to Phase 5.
jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Without this, every matrix leg computes the same cache key (setup-uv
          # runs before "Provision Python" below, so it only sees the runner's
          # ambient system Python, not matrix.python-version) and races to save
          # an identical cache entry — only the first job to finish wins, the
          # rest log "Failed to save: Unable to reserve cache ... another job
          # may be creating this cache." Harmless, but noisy; the suffix gives
          # each Python version its own cache key.
          cache-suffix: "py${{ matrix.python-version }}"

      - name: Provision Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest
